name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: baton, POSTGRES_PASSWORD: baton, POSTGRES_DB: baton_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U baton" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: "postgres://baton:baton@localhost:5432/baton_test" }
      - run: npm run build
